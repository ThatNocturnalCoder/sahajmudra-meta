name: sahaj_mudra
description: AI-powered ISL learning platform for Bharat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  http: ^1.2.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_mlkit_commons: ^0.9.0
  record: ^7.1.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#F8F5F0"

  image: assets/images/splash_logo.png

  android: true
  ios: true

  android_12:
    image: assets/images/splash_logo.png
    color: "#F8F5F0"
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/letters/
    - assets/images/numbers/
    - assets/models/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/sahajmudra.png"
  adaptive_icon_background: "#F8F5F0"
  adaptive_icon_foreground: "assets/images/sahajmudra.png"
  adaptive_icon_foreground_inset: 18